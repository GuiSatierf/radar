# Local database only (development and tests). Demo and production run on Coolify.
# A fixed project name, so the container and volume do not depend on the folder name.
name: prisciane

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: prisciane-postgres
    environment:
      POSTGRES_USER: prisciane
      POSTGRES_PASSWORD: prisciane_local_only
      POSTGRES_DB: prisciane_dev
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - prisciane-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisciane -d prisciane_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  prisciane-postgres-data:
